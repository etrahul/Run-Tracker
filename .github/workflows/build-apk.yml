name: Build Android APK

on:
  push:
    branches: [ test-apk, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Cleanly
      run: |
        unset ANDROID_SDK_ROOT
        unset ANDROID_HOME
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Web App Package & Setup Icon
      run: |
        mkdir -p app/src/main/assets/public
        mkdir -p app/src/main/res/drawable
        
        cp index.html app/src/main/assets/public/
        if [ -f icon.png ]; then 
          cp icon.png app/src/main/assets/public/; 
          cp icon.png app/src/main/res/drawable/app_icon.png;
        fi
        if [ -f manifest.json ]; then cp manifest.json app/src/main/assets/public/; fi

    - name: Create Clean Gradle Project Files
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.1'
        }
        android {
            namespace 'com.etrahul.openstride'
            compileSdk 34
            defaultConfig {
                applicationId "com.etrahul.openstride"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF
        
        mkdir -p app/src/main/java/com/etrahul/openstride
        cat << 'EOF' > app/src/main/java/com/etrahul/openstride/MainActivity.java
        package com.etrahul.openstride;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                webView.getSettings().setJavaScriptEnabled(true);
                webView.getSettings().setDomStorageEnabled(true);
                webView.getSettings().setGeolocationEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/public/index.html");
                setContentView(webView);
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
            
            <application 
                android:allowBackup="true" 
                android:label="OpenStride"
                android:icon="@drawable/app_icon"
                android:roundIcon="@drawable/app_icon">
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Generate Wrapper & Build APK
      run: |
        unset ANDROID_SDK_ROOT
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenStride-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
