name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Prepare Web Assets & Capacitor
      run: |
        mkdir -p www
        cp index.html www/
        if [ -f icon.png ]; then cp icon.png www/; fi
        if [ -f manifest.json ]; then cp manifest.json www/; fi
        npm init -y
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        npx cap init "OpenStride" "com.etrahul.openstride" --web-dir www
        npx cap add android

    - name: Inject GPS & Sensor Permissions into AndroidManifest
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />' android/app/src/main/AndroidManifest.xml

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenStride-Android-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
