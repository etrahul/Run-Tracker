name: Build Android APK

on:
  push:
    branches: [ test-apk, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Cleanly
      run: |
        unset ANDROID_SDK_ROOT
        unset ANDROID_HOME
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Web App Package & Setup Icon
      run: |
        mkdir -p app/src/main/assets/public
        mkdir -p app/src/main/res/drawable
        
        cp index.html app/src/main/assets/public/
        if [ -f sw.js ]; then cp sw.js app/src/main/assets/public/; fi
        if [ -f icon.png ]; then 
          cp icon.png app/src/main/assets/public/; 
          cp icon.png app/src/main/res/drawable/app_icon.png;
        fi
        if [ -f manifest.json ]; then cp manifest.json app/src/main/assets/public/; fi

    - name: Restore Permanent Keystore & Gradle Project Files
      run: |
        # PERMANENT FIXED BINARY KEYSTORE:
        # Pehle keytool -genkey har build mein naya random certificate banata tha jisse "package conflicts with an existing package" aata tha.
        # Ab ye fixed binary keystore har build mein 100% same SHA-256 signature rakhega!
        cat << 'B64EOF' | tr -d '\n\r ' | base64 -d > openstride.keystore
        
        B64EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        EOF
        
        cat << EOF > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.1'
        }
        android {
            namespace 'com.etrahul.openstride'
            compileSdk 34
            defaultConfig {
                applicationId "com.etrahul.openstride"
                minSdk 24
                targetSdk 34
                versionCode $((100 + ${{ github.run_number }}))
                versionName "5.0.${{ github.run_number }}"
            }
            signingConfigs {
                releaseConfig {
                    storeFile file("../openstride.keystore")
                    storePassword "openstride123"
                    keyAlias "openstride"
                    keyPassword "openstride123"
                    v1SigningEnabled true
                    v2SigningEnabled true
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.releaseConfig
                }
                release {
                    signingConfig signingConfigs.releaseConfig
                    minifyEnabled false
                    debuggable false
                }
            }
        }
        EOF
        
        mkdir -p app/src/main/java/com/etrahul/openstride
        cat << 'EOF' > app/src/main/java/com/etrahul/openstride/MainActivity.java
        package com.etrahul.openstride;

        import android.Manifest;
        import android.app.Activity;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.content.pm.PackageManager;
        import android.hardware.Sensor;
        import android.hardware.SensorEvent;
        import android.hardware.SensorEventListener;
        import android.hardware.SensorManager;
        import android.location.Location;
        import android.location.LocationListener;
        import android.location.LocationManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Environment;
        import android.provider.Settings;
        import android.speech.tts.TextToSpeech;
        import android.view.WindowManager;
        import android.webkit.GeolocationPermissions;
        import android.webkit.JavascriptInterface;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;
        import java.io.File;
        import java.io.FileOutputStream;
        import java.util.ArrayList;
        import java.util.List;
        import java.util.Locale;

        public class MainActivity extends Activity implements SensorEventListener {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private SharedPreferences prefs;
            private TextToSpeech tts;
            private boolean ttsReady = false;
            private LocationManager locationManager;
            private boolean hasSatelliteLock = false;
            private SensorManager sensorManager;
            private Sensor stepDetectorSensor;
            private Sensor stepCounterSensor;
            private int lastStepCounterVal = -1;

            private static final String PREFS_NAME = "OpenStrideNativePrefs";
            private static final int FILE_CHOOSER_RESULT_CODE = 1001;
            private static final int PERMISSION_REQUEST_CODE = 1002;

            private final LocationListener gpsListener = new LocationListener() {
                @Override
                public void onLocationChanged(Location loc) {
                    if (loc == null || webView == null) return;
                    if (LocationManager.GPS_PROVIDER.equals(loc.getProvider())) {
                        hasSatelliteLock = true;
                    } else if (hasSatelliteLock && loc.getAccuracy() > 18.0f) {
                        return;
                    }
                    final double lat = loc.getLatitude();
                    final double lng = loc.getLongitude();
                    final float acc = loc.hasAccuracy() ? loc.getAccuracy() : 10.0f;
                    final float spd = loc.hasSpeed() ? loc.getSpeed() : 0.0f;
                    runOnUiThread(() -> {
                        if (webView != null) {
                            String js = String.format(Locale.US,
                                "if(window.onNativeGpsUpdate) window.onNativeGpsUpdate(%.7f, %.7f, %.2f, %.2f);",
                                lat, lng, acc, spd);
                            webView.evaluateJavascript(js, null);
                        }
                    });
                }
                @Override public void onStatusChanged(String provider, int status, Bundle extras) {}
                @Override public void onProviderEnabled(String provider) {}
                @Override public void onProviderDisabled(String provider) {}
            };

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);

                tts = new TextToSpeech(this, status -> {
                    if (status == TextToSpeech.SUCCESS) {
                        int res = tts.setLanguage(Locale.US);
                        if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                            tts.setLanguage(Locale.getDefault());
                        }
                        tts.setSpeechRate(1.0f);
                        ttsReady = true;
                    }
                });

                locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                if (sensorManager != null) {
                    stepDetectorSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_DETECTOR);
                    stepCounterSensor = sensorManager.getDefaultSensor(Sensor.TYPE_STEP_COUNTER);
                }

                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setGeolocationEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setLoadWithOverviewMode(true);
                settings.setUseWideViewPort(true);
                settings.setMediaPlaybackRequiresUserGesture(false);

                webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                webView.setWebViewClient(new WebViewClient());

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                        callback.invoke(origin, true, false);
                    }

                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        if (MainActivity.this.filePathCallback != null) {
                            MainActivity.this.filePathCallback.onReceiveValue(null);
                        }
                        MainActivity.this.filePathCallback = filePathCallback;
                        Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("*/*");
                        startActivityForResult(Intent.createChooser(intent, "Select Backup JSON"), FILE_CHOOSER_RESULT_CODE);
                        return true;
                    }
                });

                setContentView(webView);
                requestRequiredPermissions();
                startHardwareStepSensors();
                webView.loadUrl("file:///android_asset/public/index.html");
            }

            private void startHardwareStepSensors() {
                if (sensorManager == null) return;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    if (checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED) {
                        return;
                    }
                }
                if (stepDetectorSensor != null) {
                    sensorManager.registerListener(this, stepDetectorSensor, SensorManager.SENSOR_DELAY_FASTEST);
                } else if (stepCounterSensor != null) {
                    sensorManager.registerListener(this, stepCounterSensor, SensorManager.SENSOR_DELAY_UI);
                }
            }

            private void startNativeLocationUpdates() {
                if (locationManager == null) return;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        return;
                    }
                }
                try {
                    if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                        locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 1.5f, gpsListener);
                        Location lastGps = locationManager.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                        if (lastGps != null) gpsListener.onLocationChanged(lastGps);
                    }
                    if (!hasSatelliteLock && locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                        locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 3000L, 5.0f, gpsListener);
                    }
                } catch (Exception ignored) {}
            }

            @Override
            public void onSensorChanged(SensorEvent event) {
                if (event == null || event.sensor == null || webView == null) return;
                if (event.sensor.getType() == Sensor.TYPE_STEP_DETECTOR) {
                    final int steps = Math.max(1, (int) event.values[0]);
                    runOnUiThread(() -> webView.evaluateJavascript("if(window.onNativeStepDetected) window.onNativeStepDetected(" + steps + ");", null));
                } else if (event.sensor.getType() == Sensor.TYPE_STEP_COUNTER) {
                    int total = (int) event.values[0];
                    if (lastStepCounterVal < 0) {
                        lastStepCounterVal = total;
                    } else if (total > lastStepCounterVal) {
                        final int delta = total - lastStepCounterVal;
                        lastStepCounterVal = total;
                        if (delta > 0 && delta < 50) {
                            runOnUiThread(() -> webView.evaluateJavascript("if(window.onNativeStepDetected) window.onNativeStepDetected(" + delta + ");", null));
                        }
                    }
                }
            }

            @Override
            public void onAccuracyChanged(Sensor sensor, int accuracy) {}

            private void requestRequiredPermissions() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    List<String> permissionsNeeded = new ArrayList<>();
                    if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        permissionsNeeded.add(Manifest.permission.ACCESS_FINE_LOCATION);
                    }
                    if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        permissionsNeeded.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                    }
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        if (checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED) {
                            permissionsNeeded.add(Manifest.permission.ACTIVITY_RECOGNITION);
                        }
                    }
                    if (!permissionsNeeded.isEmpty()) {
                        requestPermissions(permissionsNeeded.toArray(new String[0]), PERMISSION_REQUEST_CODE);
                    } else {
                        startNativeLocationUpdates();
                        startHardwareStepSensors();
                    }
                } else {
                    startNativeLocationUpdates();
                    startHardwareStepSensors();
                }
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == PERMISSION_REQUEST_CODE) {
                    startNativeLocationUpdates();
                    startHardwareStepSensors();
                    if (webView != null) {
                        webView.evaluateJavascript("if(window.checkPermissionAndProceed) window.checkPermissionAndProceed(true);", null);
                    }
                }
            }

            @Override
            protected void onResume() {
                super.onResume();
                startNativeLocationUpdates();
                startHardwareStepSensors();
                if (webView != null) {
                    webView.evaluateJavascript("if(window.checkPermissionAndProceed) window.checkPermissionAndProceed(false);", null);
                }
            }

            @Override
            protected void onDestroy() {
                if (locationManager != null) {
                    try { locationManager.removeUpdates(gpsListener); } catch (Exception ignored) {}
                }
                if (sensorManager != null) {
                    try { sensorManager.unregisterListener(this); } catch (Exception ignored) {}
                }
                if (tts != null) {
                    try { tts.stop(); tts.shutdown(); } catch (Exception ignored) {}
                }
                super.onDestroy();
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                    if (filePathCallback == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) {
                            results = new Uri[]{Uri.parse(dataString)};
                        }
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                } else {
                    super.onActivityResult(requestCode, resultCode, data);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }

            public class WebAppInterface {
                @JavascriptInterface
                public void saveStorage(String key, String value) {
                    if (prefs != null && key != null) {
                        prefs.edit().putString(key, value != null ? value : "").apply();
                    }
                }

                @JavascriptInterface
                public String getStorage(String key) {
                    if (prefs != null && key != null && prefs.contains(key)) {
                        return prefs.getString(key, "");
                    }
                    return "";
                }

                @JavascriptInterface
                public void speak(String text) {
                    if (tts != null && ttsReady && text != null && !text.trim().isEmpty()) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                            tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "openstride_utterance");
                        } else {
                            tts.speak(text, TextToSpeech.QUEUE_FLUSH, null);
                        }
                    }
                }

                @JavascriptInterface
                public void startNativeGps() {
                    runOnUiThread(() -> startNativeLocationUpdates());
                }

                @JavascriptInterface
                public void openAppSettings() {
                    Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                    Uri uri = Uri.fromParts("package", getPackageName(), null);
                    intent.setData(uri);
                    startActivity(intent);
                }

                @JavascriptInterface
                public void closeApp() {
                    finishAffinity();
                }

                @JavascriptInterface
                public boolean hasLocationPermission() {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                    }
                    return true;
                }

                @JavascriptInterface
                public void askPermissions() {
                    runOnUiThread(() -> requestRequiredPermissions());
                }

                @JavascriptInterface
                public void saveBackupFile(String jsonContent, String fileName) {
                    try {
                        File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        File file = new File(dir, fileName);
                        FileOutputStream fos = new FileOutputStream(file);
                        fos.write(jsonContent.getBytes());
                        fos.close();
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads: " + fileName, Toast.LENGTH_LONG).show());
                    } catch (Exception e) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "Export Error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
            
            <application 
                android:allowBackup="true" 
                android:label="OpenStride"
                android:icon="@drawable/app_icon"
                android:roundIcon="@drawable/app_icon"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Generate Wrapper & Build Release APK
      run: |
        unset ANDROID_SDK_ROOT
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleRelease -x lint
        cp app/build/outputs/apk/release/app-release.apk OpenStride.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenStride
        path: OpenStride.apk
