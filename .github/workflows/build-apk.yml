name: Build Android APK

on:
  push:
    branches: [ test-apk, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Cleanly
      run: |
        unset ANDROID_SDK_ROOT
        unset ANDROID_HOME
        
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Web App Package & Setup Icon
      run: |
        mkdir -p app/src/main/assets/public
        mkdir -p app/src/main/res/drawable
        
        cp index.html app/src/main/assets/public/
        if [ -f sw.js ]; then cp sw.js app/src/main/assets/public/; fi
        if [ -f icon.png ]; then 
          cp icon.png app/src/main/assets/public/; 
          cp icon.png app/src/main/res/drawable/app_icon.png;
        fi
        if [ -f manifest.json ]; then cp manifest.json app/src/main/assets/public/; fi

    - name: Create Fixed Keystore & Gradle Project Files
      run: |
        # Deterministic keystore taaki har baar bina uninstall kiye app seedha UPDATE ho sake
        keytool -genkey -v -keystore openstride.keystore -alias openstride -keyalg RSA -keysize 2048 -validity 10000 -storepass openstride123 -keypass openstride123 -dname "CN=Rahul Kumar, OU=OpenStride, O=OpenStride, L=Dumka, S=Jharkhand, C=IN"

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.2.1'
        }
        android {
            namespace 'com.etrahul.openstride'
            compileSdk 34
            defaultConfig {
                applicationId "com.etrahul.openstride"
                minSdk 24
                targetSdk 34
                versionCode 2
                versionName "3.0"
            }
            signingConfigs {
                fixedConfig {
                    storeFile file("../openstride.keystore")
                    storePassword "openstride123"
                    keyAlias "openstride"
                    keyPassword "openstride123"
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.fixedConfig
                }
                release {
                    signingConfig signingConfigs.fixedConfig
                    minifyEnabled false
                }
            }
        }
        EOF
        
        mkdir -p app/src/main/java/com/etrahul/openstride
        cat << 'EOF' > app/src/main/java/com/etrahul/openstride/MainActivity.java
        package com.etrahul.openstride;

        import android.Manifest;
        import android.app.Activity;
        import android.content.Intent;
        import android.content.pm.PackageManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.os.Environment;
        import android.provider.Settings;
        import android.webkit.GeolocationPermissions;
        import android.webkit.JavascriptInterface;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Toast;
        import java.io.File;
        import java.io.FileOutputStream;
        import java.util.ArrayList;
        import java.util.List;

        public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private static final int FILE_CHOOSER_RESULT_CODE = 1001;
            private static final int PERMISSION_REQUEST_CODE = 1002;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setGeolocationEnabled(true);
                settings.setAllowFileAccess(true);
                settings.setAllowContentAccess(true);
                settings.setLoadWithOverviewMode(true);
                settings.setUseWideViewPort(true);
                settings.setMediaPlaybackRequiresUserGesture(false);

                webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");
                webView.setWebViewClient(new WebViewClient());

                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                        callback.invoke(origin, true, false);
                    }

                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                        if (MainActivity.this.filePathCallback != null) {
                            MainActivity.this.filePathCallback.onReceiveValue(null);
                        }
                        MainActivity.this.filePathCallback = filePathCallback;
                        Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("*/*");
                        startActivityForResult(Intent.createChooser(intent, "Select Backup JSON"), FILE_CHOOSER_RESULT_CODE);
                        return true;
                    }
                });

                setContentView(webView);
                requestRequiredPermissions();
                webView.loadUrl("file:///android_asset/public/index.html");
            }

            private void requestRequiredPermissions() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    List<String> permissionsNeeded = new ArrayList<>();
                    if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        permissionsNeeded.add(Manifest.permission.ACCESS_FINE_LOCATION);
                    }
                    if (checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                        permissionsNeeded.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                    }
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        if (checkSelfPermission(Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED) {
                            permissionsNeeded.add(Manifest.permission.ACTIVITY_RECOGNITION);
                        }
                    }
                    if (!permissionsNeeded.isEmpty()) {
                        requestPermissions(permissionsNeeded.toArray(new String[0]), PERMISSION_REQUEST_CODE);
                    }
                }
            }

            @Override
            public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                if (requestCode == PERMISSION_REQUEST_CODE) {
                    webView. evaluateJavascript("if(window.checkPermissionAndProceed) window.checkPermissionAndProceed();", null);
                }
            }

            @Override
            protected void onResume() {
                super.onResume();
                if (webView != null) {
                    webView.evaluateJavascript("if(window.checkPermissionAndProceed) window.checkPermissionAndProceed();", null);
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                    if (filePathCallback == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) {
                            results = new Uri[]{Uri.parse(dataString)};
                        }
                    }
                    filePathCallback.onReceiveValue(results);
                    filePathCallback = null;
                } else {
                    super.onActivityResult(requestCode, resultCode, data);
                }
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }

            public class WebAppInterface {
                @JavascriptInterface
                public void openAppSettings() {
                    Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                    Uri uri = Uri.fromParts("package", getPackageName(), null);
                    intent.setData(uri);
                    startActivity(intent);
                }

                @JavascriptInterface
                public void closeApp() {
                    finishAffinity();
                    System.exit(0);
                }

                @JavascriptInterface
                public boolean hasLocationPermission() {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                    }
                    return true;
                }

                @JavascriptInterface
                public void askPermissions() {
                    runOnUiThread(() -> requestRequiredPermissions());
                }

                @JavascriptInterface
                public void saveBackupFile(String jsonContent, String fileName) {
                    try {
                        File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                        File file = new File(dir, fileName);
                        FileOutputStream fos = new FileOutputStream(file);
                        fos.write(jsonContent.getBytes());
                        fos.close();
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to Downloads: " + fileName, Toast.LENGTH_LONG).show());
                    } catch (Exception e) {
                        runOnUiThread(() -> Toast.makeText(MainActivity.this, "Export Error: " + e.getMessage(), Toast.LENGTH_LONG).show());
                    }
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
            
            <application 
                android:allowBackup="true" 
                android:label="OpenStride"
                android:icon="@drawable/app_icon"
                android:roundIcon="@drawable/app_icon"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Generate Wrapper & Build APK
      run: |
        unset ANDROID_SDK_ROOT
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug -x lint
        cp app/build/outputs/apk/debug/app-debug.apk OpenStride.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenStride
        path: OpenStride.apk
