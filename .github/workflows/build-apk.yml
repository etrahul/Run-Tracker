name: Build Android APK

on:
  push:
    branches: [ test-apk, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK Command Line Tools Manually
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Build Web App Package
      run: |
        mkdir -p app/src/main/assets/public
        cp index.html app/src/main/assets/public/
        if [ -f icon.png ]; then cp icon.png app/src/main/assets/public/; fi
        if [ -f manifest.json ]; then cp manifest.json app/src/main/assets/public/; fi

    - name: Create Minimal Gradle Project Files
      run: |
        echo "include ':app'" > settings.gradle
        cat << 'EOF' > app/build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
        }
        plugins {
            id 'com.android.application'
        }
        repositories {
            google()
            mavenCentral()
        }
        android {
            namespace 'com.etrahul.openstride'
            compileSdk 34
            defaultConfig {
                applicationId "com.etrahul.openstride"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />
            <application android:allowBackup="true" android:label="OpenStride">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Generate Wrapper & Build APK
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenStride-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
